name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check backend/

      - name: Pytest
        run: |
          if [ -d backend/tests ] && \
             find backend/tests -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest backend/tests
          else
            echo "No backend tests yet - skipping (non-blocking)."
          fi

  frontend:
    name: Frontend (lint + type-check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for frontend project
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found - skipping frontend job."
          fi

      - name: Set up Node 20
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run type-check

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present

  docker:
    name: Docker (config + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose -f docker-compose.yml config

      - name: Build images
        run: docker compose -f docker-compose.yml build
