# AI Shorts Generator - full stack
#
#   docker compose up --build
#
# Dev override (bind mounts + hot reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# All application secrets/config come from .env (see .env.example).

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-worker-common: &worker-common
  build:
    context: ./backend
    dockerfile: Dockerfile.worker
  image: ai-shorts-worker:latest
  env_file: .env
  environment:
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    api:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_shorts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-ai_shorts_generator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_shorts} -d ${POSTGRES_DB:-ai_shorts_generator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: *backend-build
    image: ai-shorts-api:latest
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *worker-common
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]

  beat:
    <<: *worker-common
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-shorts-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
